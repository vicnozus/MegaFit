<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MegaFit | Onboarding</title>

    <link rel="stylesheet" href="onboarding.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <section class="onboarding">

        <div class="container">

            <p class="subtitle">
                SUA ROTINA INTELIGENTE
            </p>

            <h1>
                Monte seu plano de evolução
            </h1>

            <p class="description">
                Escolha seus objetivos e monte uma rotina personalizada.
            </p>

            <!-- OBJETIVOS -->

            <div class="box">

                <h2>Qual é seu objetivo?</h2>

                <div class="options">

                    <button class="option-btn">
                        Ganhar massa
                    </button>

                    <button class="option-btn">
                        Melhorar rotina
                    </button>

                    <button class="option-btn">
                        Produtividade
                    </button>

                    <button class="option-btn">
                        Emagrecer
                    </button>

                    <button class="option-btn">
                        Hábitos saudáveis
                    </button>

                </div>

            </div>

            <!-- ROTINA -->

            <div class="box">

                <h2>Como é sua rotina?</h2>

                <!-- ROTINA GERAL -->

                <div class="routine-group">

                    <h3>Rotina</h3>

                    <div class="options">

                        <button class="option-btn rotina-btn" data-value="Trabalho">
                            Trabalho
                        </button>

                        <button class="option-btn rotina-btn" data-value="Escola">
                            Escola
                        </button>

                        <button class="option-btn rotina-btn" data-value="Faculdade">
                            Faculdade
                        </button>

                        <button class="option-btn rotina-btn" data-value="Casa">
                            Casa
                        </button>

                    </div>

                </div>

                <!-- HORÁRIOS -->

                <div class="routine-group">

                    <h3>Horários disponíveis</h3>

                    <div class="options">

                        <button class="option-btn horario-btn" data-value="Manhã">
                            Manhã
                        </button>

                        <button class="option-btn horario-btn" data-value="Tarde">
                            Tarde
                        </button>

                        <button class="option-btn horario-btn" data-value="Noite">
                            Noite
                        </button>

                    </div>

                </div>

                <!-- TREINO -->

                <div class="routine-group">

                    <h3>Treino</h3>

                    <div class="options">

                        <button class="option-btn treino-btn" data-value="Academia">
                            Academia
                        </button>

                        <button class="option-btn treino-btn" data-value="Corrida">
                            Corrida
                        </button>

                        <button class="option-btn treino-btn" data-value="Treino em casa">
                            Treino em casa
                        </button>

                        <button class="option-btn treino-btn" data-value="Nenhum">
                            Nenhum
                        </button>

                    </div>

                </div>

                <!-- ESTUDOS -->

                <div class="routine-group">

                    <h3>Tempo de estudos por dia</h3>

                    <div class="options">

                        <button class="option-btn estudos-btn" data-value="1h">
                            1h
                        </button>

                        <button class="option-btn estudos-btn" data-value="2h">
                            2h
                        </button>

                        <button class="option-btn estudos-btn" data-value="4h+">
                            4h+
                        </button>

                    </div>

                </div>

                <!-- TEMPO LIVRE -->

                <div class="routine-group">

                    <h3>Quanto tempo livre você tem por dia?</h3>

                    <div class="options">

                        <button class="option-btn tempo-btn" data-value="30 min">
                            30 min
                        </button>

                        <button class="option-btn tempo-btn" data-value="1h">
                            1h
                        </button>

                        <button class="option-btn tempo-btn" data-value="2h">
                            2h
                        </button>

                        <button class="option-btn tempo-btn" data-value="4h+">
                            4h+
                        </button>

                    </div>

                </div>

                <!-- SONO -->

                <div class="routine-group">

                    <h3>Horas de sono</h3>

                    <div class="options">

                        <button class="option-btn sono-btn" data-value="5h">
                            5h
                        </button>

                        <button class="option-btn sono-btn" data-value="7h">
                            7h
                        </button>

                        <button class="option-btn sono-btn" data-value="8h+">
                            8h+
                        </button>

                    </div>

                </div>

            </div>

            <!-- DADOS -->

            <div class="box">

                <h2>Seus dados</h2>

                <div class="inputs">

                    <input
                        type="number"
                        id="idade"
                        placeholder="Idade"
                    >

                    <input
                        type="number"
                        id="peso"
                        placeholder="Peso (kg)"
                    >

                    <input
                        type="number"
                        id="altura"
                        placeholder="Altura (cm)"
                    >

                </div>

            </div>

            <button id="finishBtn">
                Finalizar
            </button>

        </div>

    </section>

    <script src="onboarding.js"></script>

</body>
</html>
