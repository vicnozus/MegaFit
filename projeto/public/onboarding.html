<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MegaFit | Onboarding</title>

    <link rel="stylesheet" href="onboarding.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <section class="onboarding">

        <div class="container">

            <p class="subtitle">
                SUA ROTINA INTELIGENTE
            </p>

            <h1>Monte seu plano de evolução</h1>

            <!-- BARRA DE PROGRESSO -->
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <!-- TELAS -->

            <div class="step active">

                <h2>Qual é seu objetivo?</h2>

                <div class="options">
                    <button class="option-btn">Ganhar massa</button>
                    <button class="option-btn">Melhorar rotina</button>
                    <button class="option-btn">Produtividade</button>
                    <button class="option-btn">Emagrecer</button>
                    <button class="option-btn">Hábitos saudáveis</button>
                </div>

            </div>

            <div class="step">

                <h2>Como é sua rotina?</h2>

                <div class="options">
                    <button class="option-btn">Trabalho</button>
                    <button class="option-btn">Escola</button>
                    <button class="option-btn">Faculdade</button>
                    <button class="option-btn">Casa</button>
                </div>

            </div>

            <div class="step">

                <h2>Qual horário disponível?</h2>

                <div class="options">
                    <button class="option-btn">Manhã</button>
                    <button class="option-btn">Tarde</button>
                    <button class="option-btn">Noite</button>
                </div>

            </div>

            <div class="step">

                <h2>Você treina?</h2>

                <div class="options">
                    <button class="option-btn">Academia</button>
                    <button class="option-btn">Corrida</button>
                    <button class="option-btn">Treino em casa</button>
                    <button class="option-btn">Nenhum</button>
                </div>

            </div>

            <div class="step">

                <h2>Tempo de estudos por dia</h2>

                <div class="options">
                    <button class="option-btn">1h</button>
                    <button class="option-btn">2h</button>
                    <button class="option-btn">4h+</button>
                </div>

            </div>

            <div class="step">

                <h2>Quanto tempo livre você tem?</h2>

                <div class="options">
                    <button class="option-btn">30 min</button>
                    <button class="option-btn">1h</button>
                    <button class="option-btn">2h</button>
                    <button class="option-btn">4h+</button>
                </div>

            </div>

            <div class="step">

                <h2>Horas de sono</h2>

                <div class="options">
                    <button class="option-btn">5h</button>
                    <button class="option-btn">7h</button>
                    <button class="option-btn">8h+</button>
                </div>

            </div>

            <!-- DADOS -->

            <div class="step">

                <h2>Seus dados</h2>

                <div class="inputs">

                    <input
                        type="number"
                        placeholder="Idade"
                        id="idade"
                    >

                    <input
                        type="number"
                        placeholder="Peso (kg)"
                        id="peso"
                    >

                    <input
                        type="number"
                        placeholder="Altura (cm)"
                        id="altura"
                    >

                </div>

            </div>

            <!-- BOTÕES -->

            <div class="buttons">

                <button id="prevBtn">
                    Voltar
                </button>

                <button id="nextBtn">
                    Próximo
                </button>

            </div>

        </div>

    </section>

    <script src="onboarding.js"></script>

</body>
</html>
