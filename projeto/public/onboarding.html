<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MegaFit | Onboarding</title>

    <link rel="stylesheet" href="onboarding.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <section class="onboarding">

        <div class="container">

            <p class="subtitle">
                SUA ROTINA INTELIGENTE
            </p>

            <h1>
                Monte seu plano de evolução
            </h1>

            <p class="description">
                Escolha seus objetivos e monte uma rotina personalizada.
            </p>

            <!-- OBJETIVOS -->

            <div class="box">

                <h2>Qual é seu objetivo?</h2>

                <div class="options">

                    <button class="option-btn">
                        Ganhar massa
                    </button>

                    <button class="option-btn">
                        Melhorar rotina
                    </button>

                    <button class="option-btn">
                        Produtividade
                    </button>

                    <button class="option-btn">
                        Emagrecer
                    </button>

                    <button class="option-btn">
                        Hábitos saudáveis
                    </button>

                </div>

            </div>

            <!-- ROTINA -->

            <div class="box">

                <h2>Como é sua rotina?</h2>

                <div class="inputs">

                    <input type="text" id="rotina" placeholder="Sua rotina">

                    <input type="text" id="horarios" placeholder="Horários disponíveis">

                    <input type="text" id="treino" placeholder="Treino">

                    <input type="text" id="estudos" placeholder="Estudos">

                    <input type="text" id="sono" placeholder="Sono">

                </div>

            </div>

            <!-- DADOS -->

            <div class="box">

                <h2>Seus dados</h2>

                <div class="inputs">

                    <input type="number" id="idade" placeholder="Idade">

                    <input type="number" id="peso" placeholder="Peso (kg)">

                    <input type="number" id="altura" placeholder="Altura (cm)">

                </div>

            </div>

            <button id="finishBtn">
                Finalizar
            </button>

        </div>

    </section>

    <script src="onboarding.js"></script>

</body>
</html>
